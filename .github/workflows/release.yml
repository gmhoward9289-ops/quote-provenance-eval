name: release

# Tag push v* → build wheel/sdist, attach to GitHub release, publish to PyPI
# via OIDC trusted publishing (no stored API token).
#
# PyPI trusted publisher must match exactly:
#   owner/repo:  gmhoward9289-ops/trust-but-anchor
#   workflow:    release.yml
#   environment: pypi
#
# GitHub: Settings → Environments → create "pypi" (no secrets required for OIDC).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Attach artifacts to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
